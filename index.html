<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ceano · Lookbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="binder.png" fetchpriority="high" />
  <link rel="preload" as="image" href="rings-overlay.png" fetchpriority="high" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: oklch(0.965 0.005 80);
      --bg-2: oklch(0.94 0.008 80);
      --ink: oklch(0.22 0.02 230);
      /* binder.png is cropped to 16:9 (3092 × 1739). */
      --binder-aspect: calc(1920 / 1080);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background:
        radial-gradient(ellipse at 50% 30%, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: pan-y;
    }
    #root { width: 100%; height: 100%; }

    /* ───────────────── App layout ───────────────── */
    .app {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: clamp(8px, 1.5vw, 24px);
      padding: clamp(12px, 2vw, 32px) clamp(8px, 1.5vw, 24px);
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2400px;
      perspective-origin: 50% 50%;
    }

    /* 16:9 stage that the binder, cover, and slides all live in.
       Width is capped to either 96% of viewport OR (viewport height × 16/9),
       whichever is smaller — so the stage always fits with letterbox margins. */
    .binder-wrap {
      position: relative;
      width: min(96%, calc((100vh - 96px) * var(--binder-aspect)));
      aspect-ratio: var(--binder-aspect);
      max-height: calc(100vh - 96px);
      filter:
        drop-shadow(0 30px 50px oklch(0.2 0.02 230 / 0.22))
        drop-shadow(0 10px 20px oklch(0.2 0.02 230 / 0.14));
      transform-style: preserve-3d;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Zoom-to-fit transition after the cover-flip. The actual transform is
       set inline from JS using contain-fit math. */
    .binder-wrap.zooming,
    .binder-wrap.open {
      transition:
        transform 700ms cubic-bezier(0.5, 0, 0.2, 1),
        filter 700ms ease;
    }

    /* ───────────────── Binder artwork ───────────────── */
    .binder-img,
    .rings-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .binder-img { z-index: 1; }
    .rings-img {
      width: auto;
      height: 100%;
      /* Rings PNG is ~6.47% of binder width; render above the page-area
         so it sits visually over the slide's hinge edge. */
      z-index: 600;
      filter: drop-shadow(2px 0 4px oklch(0.2 0 0 / 0.25));
    }

    /* ───────────────── Page area (inner blue page well) ───────────────── */
    .page-area {
      position: absolute;
      z-index: 5;
      transform-style: preserve-3d;
      overflow: hidden;
      box-shadow:
        inset 0 0 0 1px oklch(0.4 0.04 230 / 0.15),
        inset 6px 12px 24px oklch(0.2 0.04 230 / 0.25),
        inset -4px -8px 18px oklch(0.2 0.04 230 / 0.18);
      border-radius: 2px;
    }

    /* ───────────────── Static slide (background of the page-area) ───────────────── */
    .static-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* ───────────────── Simple flipping page ─────────────────
       One element rotating around its left edge (rotateY 0 → -180°). Front
       face = side visible at rotateY=0; back = the opposite side (revealed
       past 90°, mostly swung off-screen at -180°). */
    .simple-flip {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      will-change: transform;
      z-index: 500;
    }
    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow:
        0 8px 24px oklch(0 0 0 / 0.22),
        0 2px 6px oklch(0 0 0 / 0.12);
    }
    .flip-back {
      transform: rotateY(180deg);
    }

    /* ───────────────── Closed cover (landing) ─────────────────
       Sits INSIDE .binder-wrap at inset:0 so the cover occupies the same
       rect as the binder. The pale background is visible in the margins. */
    .closed-cover {
      position: absolute;
      inset: 0;
      z-index: 1000;
      overflow: hidden;
      animation: coverFadeIn 0.4s ease both;
    }
    .closed-cover-image {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .closed-cover .cta-button {
      position: absolute;
      bottom: clamp(28px, 6vh, 80px);
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      color: oklch(0.95 0.005 80);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: clamp(11px, 1.1vw, 14px);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 12px 4px;
      transition: opacity 0.2s ease, gap 0.25s ease;
      /* Cover artwork has its own printed CTA; this button sits on top as
         an invisible click target. Visible only to keyboard / screen reader. */
      min-width: 240px;
      min-height: 44px;
      color: transparent;
    }
    .closed-cover .cta-button:hover { gap: 18px; }
    .closed-cover .cta-button:focus-visible {
      outline: 2px solid oklch(0.95 0.005 80 / 0.6);
      outline-offset: 6px;
      color: oklch(0.95 0.005 80);
    }
    @keyframes coverFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ───────────────── Half-page click targets ─────────────────
       Invisible left / right halves inside the page-area that trigger
       prev/next on click. */
    .click-half {
      position: absolute;
      top: 0; bottom: 0;
      width: 50%;
      z-index: 700;
      cursor: pointer;
    }
    .click-half-prev { left: 0; }
    .click-half-next { right: 0; }

    /* ───────────────── Nav buttons ───────────────── */
    .nav-btn {
      width: clamp(40px, 5vw, 58px);
      height: clamp(40px, 5vw, 58px);
      border-radius: 50%;
      border: 1px solid oklch(0.25 0.01 230 / 0.15);
      background: oklch(0.99 0.003 80);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease, opacity 200ms ease;
      box-shadow:
        0 1px 2px oklch(0.2 0 0 / 0.08),
        0 8px 24px oklch(0.2 0 0 / 0.1);
      z-index: 50;
    }
    .nav-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow:
        0 2px 4px oklch(0.2 0 0 / 0.12),
        0 14px 32px oklch(0.2 0 0 / 0.14);
    }
    .nav-btn:active:not(:disabled) {
      transform: translateY(0);
      background: oklch(0.95 0.005 80);
    }
    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .nav-btn.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ───────────────── Chrome (counter pill) ───────────────── */
    .chrome {
      position: fixed;
      bottom: clamp(14px, 2.2vw, 28px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      padding: 8px 18px;
      background: oklch(0.99 0.003 80 / 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 999px;
      box-shadow:
        0 1px 2px oklch(0 0 0 / 0.06),
        0 10px 30px oklch(0 0 0 / 0.1);
      z-index: 30;
    }
    .counter {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: var(--ink);
      display: flex;
      align-items: baseline;
      gap: 4px;
      min-width: 60px;
      justify-content: center;
    }
    .counter-num { font-size: 16px; font-weight: 600; }
    .counter-sep { color: oklch(0.6 0 0); }
    .counter-total { color: oklch(0.5 0 0); }

    /* ───────────────── Responsive ───────────────── */
    @media (max-width: 720px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
        padding: 12px;
      }
      .stage { grid-row: 1; }
      .nav-btn {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        z-index: 40;
      }
      .nav-prev { left: 8px; }
      .nav-next { right: 8px; }
      .nav-btn:hover:not(:disabled) { transform: translateY(-50%); }
      .binder-wrap {
        width: min(96%, calc((100vh - 80px) * var(--binder-aspect)));
        max-height: calc(100vh - 80px);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="pages.js?v=3"></script>
  <script src="flipbook.js?v=10"></script>
</body>
</html>
